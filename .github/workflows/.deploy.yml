name: Render CI-CD Backend

on:
  push:
    branches: [main]

jobs:
  ci-cd-process:
    runs-on: ubuntu-latest

    steps:
      # Latest v4 यूज़ करें
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Latest v4 यूज़ करें और Node.js 20 या 22 सेट करें
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # पैकेजेस इनस्टॉल करें (Clean Install के लिए npm ci या npm i)
      - name: Install Dependencies
        run: npm install

      # 🚀 रेंडर वेबहुक ट्रिगर
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
